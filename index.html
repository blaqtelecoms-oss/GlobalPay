<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlobalPay | Multi-Currency Payments for People and Businesses</title>
    <meta name="description" content="GlobalPay helps people and businesses make local, international, and crypto payments with clear estimated fees." />
    <meta property="og:title" content="GlobalPay | Multi-Currency Payments" />
    <meta property="og:description" content="Make local, international, and crypto payments with clear estimated fees." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Crawlers need an absolute image URL, so resolve it against the live origin.
      (function () {
        var image = window.location.origin + '/og-image.png';
        ['og:image', 'twitter:image'].forEach(function (name) {
          var tag = document.querySelector('meta[property="' + name + '"], meta[name="' + name + '"]');
          if (tag) tag.setAttribute('content', image);
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
